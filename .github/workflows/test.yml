name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install maturin pytest pyboy==2.7.0 numpy pillow
          maturin build --release --locked --out dist
          python -m pip install --no-index --find-links dist pyboy-rs
      - run: python -m pytest -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.os == 'ubuntu-latest'
        with:
          name: test-linux-wheel
          path: dist/*.whl
