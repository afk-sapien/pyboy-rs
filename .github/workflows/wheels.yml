name: Wheels
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto}
          - {name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto}
          - {name: macos-x86_64, os: macos-13, target: x86_64, manylinux: auto}
          - {name: macos-arm64, os: macos-14, target: aarch64, manylinux: auto}
          - {name: windows-x86_64, os: windows-latest, target: x64, manylinux: auto}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.name }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-latest}
          - {name: macos-x86_64, os: macos-13}
          - {name: macos-arm64, os: macos-14}
          - {name: windows-x86_64, os: windows-latest}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - name: Install wheel and import
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist pyboy-rs
          python -c "import pyboy_rs, pyboy_rs._native; print('import ok', pyboy_rs.__file__)"

  smoke-linux-aarch64:
    name: smoke linux-aarch64 (qemu)
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-aarch64
          path: dist
      - uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q
            apt-get install -y -q python3 python3-pip
          run: |
            python3 -m pip install --no-index --find-links dist pyboy-rs
            python3 -c "import pyboy_rs, pyboy_rs._native; print('import ok')"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Smoke test sdist build
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import pyboy_rs._native; print('import ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
