[workspace]
members = ["crates/pyboy-core", "crates/pyboy-python"]
default-members = ["crates/pyboy-core"]
resolver = "2"

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "LGPL-3.0-only"
rust-version = "1.85"

[profile.release]
lto = "fat"
codegen-units = 1
# Keep panic = "unwind" so a core panic reaches Python as an exception
# (docs/core-speed-design.md, Other candidates, item 8).
