[package]
name = "pyboy-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Component and frame timing instrumentation. Off in release wheels: it adds work to the
# emulation loop. Build with `maturin build --release --features profile` to enable it.
profile = ["pyboy-core/profile"]

[dependencies]
pyboy-core = { path = "../pyboy-core" }
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
