[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pyboy-rs"
version = "0.1.0"
description = "Rust translation of PyBoy emulator components with PyO3 bindings"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
license-files = ["LICENSE.md", "COPYING", "NOTICE"]
readme = "README.md"

[project.urls]
Repository = "https://github.com/afk-sapien/pyboy-rs"

[project.optional-dependencies]
test = ["pytest>=8", "pyboy==2.7.0"]
images = ["numpy", "pillow>=10"]

[tool.maturin]
manifest-path = "crates/pyboy-python/Cargo.toml"
python-source = "python"
module-name = "pyboy_rs._native"
include = [
  { path = "reference/**/*", format = "sdist" },
  { path = "tools/**/*", format = "sdist" },
  { path = "tests/**/*", format = "sdist" },
  { path = "benchmarks/*.json", format = "sdist" },
  { path = "README.md", format = "sdist" },
  { path = "EXECUTION.rst", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
